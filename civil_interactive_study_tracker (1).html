
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 0.5rem 0 1rem; }

.sem-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 0 10px; }
.sem-tab { font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 20px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; }
.sem-tab.active { color: #fff; }
.sem-tab:not(.active) { background: var(--color-background-secondary); color: var(--color-text-secondary); border-color: var(--color-border-tertiary); }
.s2 { background:#1B4F72; border-color:#1B4F72; }
.s3 { background:#1A5276; border-color:#1A5276; }
.s4 { background:#145A32; border-color:#145A32; }
.s5 { background:#512E5F; border-color:#512E5F; }
.s2i { border-color:#1B4F72; color:#1B4F72 !important; }
.s3i { border-color:#1A5276; color:#1A5276 !important; }
.s4i { border-color:#145A32; color:#145A32 !important; }
.s5i { border-color:#512E5F; color:#512E5F !important; }

.sem-section { display: none; }
.sem-section.active { display: block; }

.subject-block { margin-bottom: 1.4rem; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }
.subject-header { padding: 0.65rem 1rem; background: var(--color-background-secondary); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
.subject-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
.subject-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 1px; }

.score-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; transition: all 0.3s; }
.score-fail { background:#FCEBEB; color:#791F1F; }
.score-pass { background:#EAF3DE; color:#27500A; }
@media (prefers-color-scheme: dark) {
  .score-fail { background:#791F1F; color:#F7C1C1; }
  .score-pass { background:#27500A; color:#C0DD97; }
}

.chart-area { padding: 0.8rem 0.75rem 0.4rem; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; border-radius: 6px; padding: 2px 4px; transition: background 0.1s; }
.bar-row:hover { background: var(--color-background-secondary); }
.bar-row.done { opacity: 1; }

.ch-check { width: 18px; height: 18px; min-width: 18px; border-radius: 4px; border: 1.5px solid var(--color-border-secondary); display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 11px; cursor: pointer; }
.ch-check.checked { background: #1D9E75; border-color: #1D9E75; color: white; }

.ch-label { font-size: 11px; color: var(--color-text-secondary); width: 170px; min-width: 170px; text-align: right; line-height: 1.3; transition: color 0.2s; }
.bar-row.done .ch-label { color: var(--color-text-primary); font-weight: 500; }

.bar-outer { flex: 1; height: 22px; background: var(--color-background-secondary); border-radius: 5px; position: relative; overflow: visible; }
.bar-fill { height: 100%; border-radius: 5px; transition: opacity 0.2s; }
.bar-row:not(.done) .bar-fill { opacity: 0.35; }
.bar-row.done .bar-fill { opacity: 1; }

.bar-val { font-size: 11px; font-weight: 500; min-width: 22px; text-align: center; color: var(--color-text-primary); }
.diff-tag { font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 20px; white-space: nowrap; min-width: 68px; text-align: center; }
.easy   { background:#EAF3DE; color:#27500A; }
.star   { background:#EEEDFE; color:#3C3489; }
.medium { background:#FAEEDA; color:#633806; }
.hard   { background:#FCEBEB; color:#791F1F; }
@media (prefers-color-scheme: dark) {
  .easy   { background:#27500A; color:#C0DD97; }
  .star   { background:#3C3489; color:#CECBF6; }
  .medium { background:#633806; color:#FAC775; }
  .hard   { background:#791F1F; color:#F7C1C1; }
}

.pass-line { position:absolute; top:-4px; bottom:-4px; width:2.5px; border-radius:2px; z-index:10; pointer-events:none; transition: left 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.pass-line-label { position:absolute; top:-18px; transform:translateX(-50%); font-size:8px; font-weight:600; white-space:nowrap; background:var(--color-background-primary); padding:1px 3px; border-radius:3px; }

.divider-row { display: flex; align-items: center; gap: 6px; margin: 1px 0 1px 204px; }
.divider-line { flex:1; border-top: 1px dashed var(--color-border-secondary); }
.divider-lbl { font-size: 10px; color: var(--color-text-tertiary); font-weight: 500; white-space: nowrap; }

.progress-bar-wrap { height: 5px; background: var(--color-background-secondary); }
.progress-bar-fill { height: 100%; background: #1D9E75; transition: width 0.4s ease; }

.footer-row { padding: 0.5rem 0.75rem; background: var(--color-background-secondary); border-top: 0.5px solid var(--color-border-tertiary); font-size: 11px; color: var(--color-text-secondary); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.footer-row b { color: var(--color-text-primary); font-weight: 600; }
.tip-row { padding: 5px 10px; font-size: 11px; font-weight: 500; color: #27500A; border-top: 0.5px solid var(--color-border-tertiary); }
.tip-green { background: #EAF3DE; }
.tip-pass  { background: #d4edda; }
@media (prefers-color-scheme: dark) {
  .tip-row { color: #b8d98a; }
  .tip-green { background: #1a3306; }
  .tip-pass  { background: #0f3320; }
}

.legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 0 0 10px; font-size: 11px; color: var(--color-text-secondary); align-items: center; }
.leg-item { display: flex; align-items: center; gap: 4px; }
.leg-dot { width: 10px; height: 10px; border-radius: 2px; }
.hint { font-size: 10px; color: var(--color-text-tertiary); font-style: italic; }
</style>

const DIFF_COLORS = { easy:'#1D9E75', star:'#7F77DD', medium:'#BA7517', hard:'#E24B4A' };
const DIFF_LABELS = { easy:'Easy', star:'★ Best ROI', medium:'Medium', hard:'Hard' };
const state = {}; // state[subjectId][chapterIndex] = true/false

function getDoneMarks(subj) {
  let done = 0;
  (subj.chapters || []).forEach((ch, i) => {
    if (state[subj.id] && state[subj.id][i]) done += ch.marks;
  });
  return done;
}

function updateSubject(subj) {
  const done = getDoneMarks(subj);
  const pct = done / subj.total;
  const passPct = subj.pass / subj.total;
  const passed = done >= subj.pass;

  // Update score badge
  const badge = document.getElementById('badge-' + subj.id);
  if (badge) {
    badge.textContent = `${done} / ${subj.total} pts ${passed ? '✓ PASSED!' : `(need ${subj.pass - done} more)`}`;
    badge.className = 'score-badge ' + (passed ? 'score-pass' : 'score-fail');
  }

  // Update progress bar
  const prog = document.getElementById('prog-' + subj.id);
  if (prog) prog.style.width = Math.min(100, pct * 100) + '%';

  // Update all pass lines in this subject
  document.querySelectorAll(`.pass-line-${subj.id}`).forEach(line => {
    const lineLabel = line.querySelector('.pass-line-label');
    if (passed) {
      line.style.background = '#1D9E75';
      line.style.left = (pct * 100).toFixed(1) + '%';
      if (lineLabel) { lineLabel.textContent = `Done: ${done}`; lineLabel.style.color = '#1D9E75'; }
    } else {
      line.style.background = '#E24B4A';
      line.style.left = (passPct * 100).toFixed(1) + '%';
      if (lineLabel) { lineLabel.textContent = `Need ${subj.pass}`; lineLabel.style.color = '#E24B4A'; }
    }
  });

  // Update tip
  const tip = document.getElementById('tip-' + subj.id);
  if (tip) {
    if (passed) {
      tip.className = 'tip-row tip-pass';
      tip.textContent = `🎉 You've covered ${done} marks — enough to PASS! Keep going for a better score.`;
    } else {
      tip.className = 'tip-row tip-green';
      tip.textContent = `💡 ${subj.tip}`;
    }
  }
}

function toggleChapter(subjId, idx, subj) {
  if (!state[subjId]) state[subjId] = {};
  state[subjId][idx] = !state[subjId][idx];
  const row = document.getElementById(`row-${subjId}-${idx}`);
  const check = document.getElementById(`chk-${subjId}-${idx}`);
  if (row) row.classList.toggle('done', !!state[subjId][idx]);
  if (check) check.classList.toggle('checked', !!state[subjId][idx]);
  if (check) check.textContent = state[subjId][idx] ? '✓' : '';
  updateSubject(subj);
}

function buildSubject(subj) {
  if (!state[subj.id]) state[subj.id] = {};
  const div = document.createElement('div');
  div.className = 'subject-block';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'subject-header';
  hdr.innerHTML = `
    <div>
      <div class="subject-title">${subj.title}</div>
      <div class="subject-sub">${subj.sub}</div>
    </div>
    <span class="score-badge score-fail" id="badge-${subj.id}">0 / ${subj.total} pts (need ${subj.pass} more)</span>
  `;
  div.appendChild(hdr);

  // Progress bar
  const pbWrap = document.createElement('div');
  pbWrap.className = 'progress-bar-wrap';
  pbWrap.innerHTML = `<div class="progress-bar-fill" id="prog-${subj.id}" style="width:0%"></div>`;
  div.appendChild(pbWrap);

  // Chart area
  const chart = document.createElement('div');
  chart.className = 'chart-area';

  const diffOrder = {easy:0, star:0, medium:1, hard:2};
  let lastLevel = -1;

  subj.chapters.forEach((ch, i) => {
    const lv = diffOrder[ch.diff] ?? 1;
    if (lastLevel >= 0 && lv > lastLevel) {
      const divRow = document.createElement('div');
      divRow.className = 'divider-row';
      divRow.innerHTML = `<div class="divider-line"></div><div class="divider-lbl">↓ ${lv===1?'Medium':'Hard'}</div><div class="divider-line"></div>`;
      chart.appendChild(divRow);
    }
    lastLevel = Math.max(lastLevel, lv);

    const bc = DIFF_COLORS[ch.diff] || '#BA7517';
    const pct = (ch.marks / subj.total * 100).toFixed(1);
    const passPct = (subj.pass / subj.total * 100).toFixed(1);

    const row = document.createElement('div');
    row.className = 'bar-row';
    row.id = `row-${subj.id}-${i}`;
    row.onclick = () => toggleChapter(subj.id, i, subj);

    row.innerHTML = `
      <div class="ch-check" id="chk-${subj.id}-${i}"></div>
      <div class="ch-label">${ch.name}</div>
      <div class="bar-outer" style="position:relative;overflow:visible;">
        <div class="bar-fill" style="width:${pct}%;background:${bc};"></div>
        <div class="pass-line pass-line-${subj.id}" style="left:${passPct}%;background:#E24B4A;">
          <div class="pass-line-label" style="color:#E24B4A;">Need ${subj.pass}</div>
        </div>
      </div>
      <span class="bar-val">${ch.marks}</span>
      <span class="diff-tag ${ch.diff}">${DIFF_LABELS[ch.diff]}</span>
    `;
    chart.appendChild(row);
  });

  div.appendChild(chart);

  // Footer
  const foot = document.createElement('div');
  foot.className = 'footer-row';
  foot.innerHTML = `<span>Total: <b>${subj.total} marks</b></span><span>Pass: <b>${subj.pass}</b></span><span style="color:var(--color-text-tertiary);font-size:10px;">Tap chapters to mark done ↑</span>`;
  div.appendChild(foot);

  // Tip
  const tip = document.createElement('div');
  tip.className = 'tip-row tip-green';
  tip.id = 'tip-' + subj.id;
  tip.textContent = `💡 ${subj.tip}`;
  div.appendChild(tip);

  return div;
}

function buildSem(semKey) {
  const semData = DATA[semKey];
  const sec = document.createElement('div');
  sec.className = 'sem-section';
  sec.id = 'sec-' + semKey;
  semData.subjects.forEach(subj => sec.appendChild(buildSubject(subj)));
  return sec;
}

const container = document.getElementById('sem-container');
['s2','s3','s4','s5'].forEach(key => {
  const sec = buildSem(key);
  if (key === 's2') sec.classList.add('active');
  container.appendChild(sec);
});

function showSem(sem, el) {
  document.querySelectorAll('.sem-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sem-tab').forEach(t => {
    t.classList.remove('active','s2','s3','s4','s5');
    const base = [...t.classList].find(c => c.endsWith('i'));
    if(base) { t.className = 'sem-tab ' + base; }
  });
  document.getElementById('sec-' + sem).classList.add('active');
  el.classList.add('active');
  el.classList.remove('s2i','s3i','s4i','s5i');
  el.classList.add(sem);
}
