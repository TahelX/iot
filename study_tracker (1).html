<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civil Engineering Study Tracker</title>
<style>
:root {
  --bg: #ffffff; --bg2: #f5f5f2; --text: #1a1a1a; --text2: #666660;
  --border: #e0ddd5; --radius: 10px;
  --green-dark: #27500A; --green-mid: #1D9E75; --green-light: #EAF3DE;
  --purple-mid: #7F77DD; --purple-light: #EEEDFE; --purple-dark: #3C3489;
  --amber-mid: #BA7517; --amber-light: #FAEEDA; --amber-dark: #633806;
  --red-mid: #E24B4A; --red-light: #FCEBEB; --red-dark: #791F1F;
  --s2: #1B4F72; --s3: #1A5276; --s4: #145A32; --s5: #512E5F;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a18; --bg2: #242420; --text: #e8e5dc; --text2: #9a9690;
    --border: #3a3830;
    --green-light: #1a3306; --green-dark: #b8d98a;
    --purple-light: #1e1b40; --purple-dark: #b0acf0;
    --amber-light: #3a1f04; --amber-dark: #f5c07a;
    --red-light: #3a0f0f; --red-dark: #f5a0a0;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }

.app { max-width: 700px; margin: 0 auto; padding: 16px 12px 40px; }
h1 { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
.subtitle { font-size: 12px; color: var(--text2); margin-bottom: 14px; }

/* Save status */
.save-status { font-size: 11px; color: var(--text2); padding: 3px 8px; border-radius: 20px; background: var(--bg2); display: inline-block; margin-bottom: 10px; transition: all 0.3s; }
.save-status.saving { color: var(--amber-mid); }
.save-status.saved  { color: var(--green-mid); }
.save-status.error  { color: var(--red-mid); }

/* Tabs */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; cursor: pointer; border: 1.5px solid transparent; transition: all 0.15s; background: var(--bg2); color: var(--text2); }
.tab.active { color: #fff; }
.tab[data-sem="s2"].active { background: var(--s2); }
.tab[data-sem="s3"].active { background: var(--s3); }
.tab[data-sem="s4"].active { background: var(--s4); }
.tab[data-sem="s5"].active { background: var(--s5); }
.tab[data-sem="s2"] { border-color: var(--s2); }
.tab[data-sem="s3"] { border-color: var(--s3); }
.tab[data-sem="s4"] { border-color: var(--s4); }
.tab[data-sem="s5"] { border-color: var(--s5); }

/* Legend */
.legend { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 11px; color: var(--text2); align-items: center; }
.leg { display: flex; align-items: center; gap: 4px; }
.leg-dot { width: 9px; height: 9px; border-radius: 2px; }
.hint { font-style: italic; font-size: 10px; }

/* Section */
.sem-section { display: none; }
.sem-section.active { display: block; }

/* Subject card */
.subject-card { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden; }
.subj-header { padding: 10px 12px; background: var(--bg2); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.subj-title { font-size: 14px; font-weight: 600; }
.subj-sub { font-size: 10px; color: var(--text2); margin-top: 2px; }
.score-badge { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; transition: all 0.3s; }
.badge-fail { background: var(--red-light); color: var(--red-dark); }
.badge-pass { background: var(--green-light); color: var(--green-dark); }

/* Progress strip */
.prog-wrap { height: 4px; background: var(--bg2); }
.prog-fill { height: 100%; background: var(--green-mid); border-radius: 0 2px 2px 0; transition: width 0.4s ease; }

/* Chart */
.chart { padding: 10px 10px 6px; }
.divider { display: flex; align-items: center; gap: 6px; margin: 4px 0 4px 182px; }
.div-line { flex: 1; border-top: 1px dashed var(--border); }
.div-lbl { font-size: 9px; color: var(--text2); font-weight: 600; white-space: nowrap; }

.bar-row { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; cursor: pointer; border-radius: 6px; padding: 3px 4px; transition: background 0.1s; user-select: none; }
.bar-row:hover { background: var(--bg2); }
.bar-row:active { opacity: 0.8; }

.ch-check { width: 17px; height: 17px; min-width: 17px; border-radius: 4px; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; transition: all 0.15s; }
.ch-check.checked { background: var(--green-mid); border-color: var(--green-mid); color: #fff; }

.ch-label { font-size: 10.5px; color: var(--text2); width: 160px; min-width: 160px; text-align: right; line-height: 1.3; transition: all 0.2s; }
.bar-row.done .ch-label { color: var(--text); font-weight: 600; }

.bar-outer { flex: 1; height: 20px; background: var(--bg2); border-radius: 5px; position: relative; overflow: visible; }
.bar-fill { height: 100%; border-radius: 5px; transition: opacity 0.2s; }
.bar-row:not(.done) .bar-fill { opacity: 0.3; }
.bar-row.done .bar-fill { opacity: 1; }

/* Pass line */
.pline { position: absolute; top: -4px; bottom: -4px; width: 2.5px; border-radius: 2px; z-index: 10; pointer-events: none; transition: left 0.5s cubic-bezier(0.34,1.56,0.64,1), background 0.4s; }
.pline-lbl { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 700; white-space: nowrap; padding: 1px 3px; border-radius: 3px; background: var(--bg); transition: color 0.4s; }

.bar-val { font-size: 11px; font-weight: 600; min-width: 20px; text-align: center; }
.diff-tag { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 20px; white-space: nowrap; min-width: 62px; text-align: center; }
.easy   { background: var(--green-light);  color: var(--green-dark);  }
.star   { background: var(--purple-light); color: var(--purple-dark); }
.medium { background: var(--amber-light);  color: var(--amber-dark);  }
.hard   { background: var(--red-light);    color: var(--red-dark);    }

.tip { padding: 7px 10px; font-size: 10.5px; font-weight: 500; border-top: 1px solid var(--border); transition: all 0.3s; }
.tip-default { background: var(--green-light); color: var(--green-dark); }
.tip-done    { background: #d4edda; color: #155724; }
@media (prefers-color-scheme: dark) { .tip-done { background: #0f3320; color: #75d8a0; } }

.loading { text-align: center; padding: 40px; color: var(--text2); font-size: 13px; }
.group-label { font-size: 11px; font-weight: 700; color: var(--text); margin: 10px 0 5px 0; padding: 4px 8px; background: var(--bg2); border-radius: 6px; border-left: 3px solid var(--border); }
</style>
</head>
<body>

const COLORS = {easy:'#1D9E75', star:'#7F77DD', medium:'#BA7517', hard:'#E24B4A'};
const LABELS = {easy:'Easy', star:'★ Best ROI', medium:'Medium', hard:'Hard'};
const DORDER = {easy:0, star:0, medium:1, hard:2};

// State: { subjId: [bool, bool, ...] }
let state = {};
let saveTimer = null;
let currentSem = 's2';

// ── LocalStorage (fallback for GitHub hosting) ────────────────────────────
const LS_KEY = 'civil_tracker_v1';

function loadFromLS() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveToLS(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
}

// ── Render ────────────────────────────────────────────────────────────────
function buildSubject(subj) {
  const card = document.createElement('div');
  card.className = 'subject-card';

  // Header
  card.innerHTML = `
    <div class="subj-header">
      <div>
        <div class="subj-title">${subj.title}</div>
        <div class="subj-sub">${subj.sub}</div>
      </div>
      <span class="score-badge badge-fail" id="badge-${subj.id}">0 / ${subj.total}</span>
    </div>
    <div class="prog-wrap"><div class="prog-fill" id="prog-${subj.id}" style="width:0%"></div></div>
  `;

  const chart = document.createElement('div');
  chart.className = 'chart';
  let lastLv = -1;
  let lastGrp = null;

  // Group label config for Math-II
  const GRP_CFG = {
    'A1 ·': {label:'📐 Group A1 · 2D Co-ordinate Geometry · 6 marks', color:'#1B4F72'},
    'A2 ·': {label:'📦 Group A2 · 3D Co-ordinate Geometry · 4 marks', color:'#1A5276'},
    'B  ·': {label:'📊 Group B · Statistics · 5 marks', color:'#145A32'},
    'C  ·': {label:'🔢 Group C · Differential Calculus · 25 marks', color:'#512E5F'},
    'D  ·': {label:'∫  Group D · Integration · 20 marks', color:'#7D4E00'},
  };

  subj.chapters.forEach((ch, i) => {
    const lv = DORDER[ch.d] ?? 1;

    // Check if this chapter belongs to a named group (Math-II style)
    let grpKey = null;
    for (const k of Object.keys(GRP_CFG)) { if (ch.n.startsWith(k)) { grpKey = k; break; } }

    if (grpKey && grpKey !== lastGrp) {
      lastGrp = grpKey;
      lastLv = -1; // reset difficulty divider per group
      const gl = document.createElement('div');
      gl.className = 'group-label';
      gl.style.borderLeftColor = GRP_CFG[grpKey].color;
      gl.textContent = GRP_CFG[grpKey].label;
      chart.appendChild(gl);
    }

    if (!grpKey && lastLv >= 0 && lv > lastLv) {
      const dv = document.createElement('div');
      dv.className = 'divider';
      dv.innerHTML = `<div class="div-line"></div><div class="div-lbl">↓ ${lv===1?'Medium':'Hard'}</div><div class="div-line"></div>`;
      chart.appendChild(dv);
    }
    lastLv = Math.max(lastLv, lv);

    const bc = COLORS[ch.d];
    const fillW = (ch.m / subj.total * 100).toFixed(1);
    const passW = (subj.pass / subj.total * 100).toFixed(1);
    const done = state[subj.id] && state[subj.id][i];

    const row = document.createElement('div');
    row.className = 'bar-row' + (done ? ' done' : '');
    row.id = `row-${subj.id}-${i}`;
    const displayName = grpKey ? ch.n.replace(grpKey, '').trim() : ch.n;
    row.innerHTML = `
      <div class="ch-check${done?' checked':''}" id="chk-${subj.id}-${i}">${done?'✓':''}</div>
      <div class="ch-label">${displayName}</div>
      <div class="bar-outer">
        <div class="bar-fill" style="width:${fillW}%;background:${bc}"></div>
        <div class="pline pline-${subj.id}" style="left:${passW}%;background:#E24B4A;">
          <div class="pline-lbl" style="color:#E24B4A;">Need ${subj.pass}</div>
        </div>
      </div>
      <span class="bar-val">${ch.m}</span>
      <span class="diff-tag ${ch.d}">${LABELS[ch.d]}</span>
    `;
    row.onclick = () => toggle(subj, i);
    chart.appendChild(row);
  });

  card.appendChild(chart);

  const tip = document.createElement('div');
  tip.className = 'tip tip-default';
  tip.id = 'tip-' + subj.id;
  tip.textContent = '💡 ' + subj.tip;
  card.appendChild(tip);

  return card;
}

function refreshSubject(subj) {
  const marks = (state[subj.id] || []).reduce((s, v, i) => s + (v ? subj.chapters[i].m : 0), 0);
  const passed = marks >= subj.pass;
  const pct = marks / subj.total;
  const passPct = subj.pass / subj.total;

  const badge = document.getElementById('badge-' + subj.id);
  if (badge) {
    badge.textContent = passed ? `${marks} ✓ PASSED!` : `${marks} / ${subj.total} (need ${subj.pass - marks} more)`;
    badge.className = 'score-badge ' + (passed ? 'badge-pass' : 'badge-fail');
  }

  const prog = document.getElementById('prog-' + subj.id);
  if (prog) prog.style.width = Math.min(100, pct * 100) + '%';

  document.querySelectorAll(`.pline-${subj.id}`).forEach(line => {
    const lbl = line.querySelector('.pline-lbl');
    if (passed) {
      line.style.background = '#1D9E75';
      line.style.left = (pct * 100).toFixed(1) + '%';
      if (lbl) { lbl.textContent = `Done: ${marks}`; lbl.style.color = '#1D9E75'; }
    } else {
      line.style.background = '#E24B4A';
      line.style.left = (passPct * 100).toFixed(1) + '%';
      if (lbl) { lbl.textContent = `Need ${subj.pass}`; lbl.style.color = '#E24B4A'; }
    }
  });

  const tip = document.getElementById('tip-' + subj.id);
  if (tip) {
    tip.className = 'tip ' + (passed ? 'tip-done' : 'tip-default');
    tip.textContent = passed
      ? `🎉 ${marks} marks covered — PASSED! Keep going for a better score.`
      : `💡 ${subj.tip}`;
  }
}

function toggle(subj, idx) {
  if (!state[subj.id]) state[subj.id] = new Array(subj.chapters.length).fill(false);
  state[subj.id][idx] = !state[subj.id][idx];

  const row = document.getElementById(`row-${subj.id}-${idx}`);
  const chk = document.getElementById(`chk-${subj.id}-${idx}`);
  if (row) row.classList.toggle('done', state[subj.id][idx]);
  if (chk) { chk.classList.toggle('checked', state[subj.id][idx]); chk.textContent = state[subj.id][idx] ? '✓' : ''; }

  refreshSubject(subj);
  scheduleSave();
}

function scheduleSave() {
  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = '💾 Saving...'; el.className = 'save-status saving'; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistSave, 600);
}

function persistSave() {
  // Save to localStorage (works on GitHub Pages)
  saveToLS(state);
  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = '✅ Progress saved'; el.className = 'save-status saved'; }
  setTimeout(() => { if (el) { el.textContent = '🟢 Auto-saving on'; el.className = 'save-status saved'; } }, 2000);
}

function buildAll(savedState) {
  state = savedState || {};
  const container = document.getElementById('container');
  container.innerHTML = '';

  ['s2','s3','s4','s5'].forEach(semKey => {
    const sec = document.createElement('div');
    sec.className = 'sem-section' + (semKey === 's2' ? ' active' : '');
    sec.id = 'sec-' + semKey;
    DATA[semKey].forEach(subj => {
      // Init state arrays
      if (!state[subj.id]) state[subj.id] = new Array(subj.chapters.length).fill(false);
      sec.appendChild(buildSubject(subj));
      refreshSubject(subj);
    });
    container.appendChild(sec);
  });

  const el = document.getElementById('saveStatus');
  if (el) { el.textContent = '🟢 Auto-saving on'; el.className = 'save-status saved'; }
}

function showSem(sem, el) {
  currentSem = sem;
  document.querySelectorAll('.sem-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + sem).classList.add('active');
  el.classList.add('active');
}

// ── Boot ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const saved = loadFromLS();
  buildAll(saved);
});
</script>
